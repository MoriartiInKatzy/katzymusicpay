<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katzy Music — Личный кабинет</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0a0a0c);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        /* Шапка с логотипом */
        .app-header {
            position: sticky;
            top: 0;
            background-color: rgba(10, 10, 12, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 20;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .app-logo {
            height: 32px;
            object-fit: contain;
        }

        /* Контент профиля */
        .profile-container {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Аватарка */
        .avatar-wrapper {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 14px;
            background-color: #1c1c1e;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Имя пользователя */
        .user-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            text-align: center;
        }

        .user-tag {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 24px;
        }

        /* Стеклянная карточка баланса */
        .balance-card {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .balance-title {
            font-size: 14px;
            color: var(--hint-color);
            font-weight: 500;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Кнопка действия */
        .action-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            margin-top: 8px;
        }

        .action-btn:active {
            transform: scale(0.96);
            background: #e5e5ea;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header class="app-header">
        <img class="app-logo" src="logo.png" alt="KATZY MUSIC" onerror="this.src='https://picsum.photos/120/35?random=logo'">
    </header>

    <!-- Профиль -->
    <div class="profile-container">
        <div class="avatar-wrapper">
            <img class="avatar-img" id="user-avatar" src="https://picsum.photos/200" alt="Avatar">
        </div>
        <div class="user-name" id="user-name">Загрузка...</div>
        <div class="user-tag" id="user-tag">@username</div>

        <!-- Карточка счета -->
        <div class="balance-card">
            <span class="balance-title">Ваш баланс счета</span>
            <span class="balance-amount" id="user-balance">0 ₽</span>
            <span style="font-size: 12px; color: var(--hint-color);">Средства на счету можно использовать для оплаты услуг и заказов Katzy Music.</span>
        </div>

        <button class="action-btn" onclick="requestTopUp()">Пополнить счет</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Получаем данные пользователя из Telegram
        const user = tg.initDataUnsafe && tg.initDataUnsafe.user;

        if (user) {
            document.getElementById('user-name').innerText = `${user.first_name || ''} ${user.last_name || ''}`.trim();
            document.getElementById('user-tag').innerText = user.username ? `@${user.username}` : `ID: ${user.id}`;
            if (user.photo_url) {
                document.getElementById('user-avatar').src = user.photo_url;
            }
        } else {
            // Заглушка для теста вне Telegram
            document.getElementById('user-name').innerText = 'Никита Сарычев';
            document.getElementById('user-tag').innerText = '@MoriartiInKatzy';
        }

        // Баланс (в будущем подключим к твоей базе данных)
        let currentBalance = 0; 
        document.getElementById('user-balance').innerText = currentBalance.toLocaleString() + ' ₽';

        function requestTopUp() {
            const text = encodeURIComponent(`Привет! Хочу пополнить баланс аккаунта в KATZY MUSIC.`);
            tg.openTelegramLink(`https://t.me/MoriartiInKatzy?text=${text}`);
        }
    </script>
</body>
</html>
